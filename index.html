<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FAC800" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" href="/favicon.png?v=6" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=6" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Instrument+Serif:ital@0;1&family=Playfair+Display:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Instrument+Serif:ital@0;1&family=Playfair+Display:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Instrument+Serif:ital@0;1&family=Playfair+Display:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" /></noscript>
    <link rel="dns-prefetch" href="//wa.me" />

    <!-- O título era "Esquadrão de IA para Automatizar seu Negócio 24h" — copy do template da
         SQUAAD, que não tem nada a ver com o IAS Instituto e era o que aparecia na aba e no
         Google. -->
    <title>+ que Vencedores — Comunidade IAS Instituto</title>
    <meta
      name="description"
      content="A maior comunidade de desenvolvimento pessoal, profissional e financeiro do Brasil. Aulas, treinamentos e cursos com Isaac Santos e os treinadores do IAS Instituto — gratuitos nos primeiros 12 meses."
    />

    <!-- Open Graph: o link de indicação é feito pra ser colado no WhatsApp. Sem isto, o
         convite do membro aparece como uma URL crua, sem título nem imagem — que é o mesmo
         que não ter convite. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="+ que Vencedores" />
    <meta property="og:title" content="+ que Vencedores — Comunidade IAS Instituto" />
    <meta
      property="og:description"
      content="Melhore sua vida espiritual, emocional, profissional e financeira ao lado de pessoas que decidiram viver com propósito. Cadastro gratuito."
    />
    <meta property="og:url" content="https://iasinstituto.com.br/maisvencedores" />
    <meta property="og:locale" content="pt_BR" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- FALTA a og:image (1200x630). Sem ela o preview vai sem imagem. Não inventei uma:
         precisa ser arte real do Instituto. -->
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
